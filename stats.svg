<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sayan's GitHub stats" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Sayan's GitHub Stats</title>

<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#120a20"/>
    <stop offset="100%" stop-color="#1d0e30"/>
  </linearGradient>
  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff3fb0"/>
    <stop offset="100%" stop-color="#9b5cf6"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <style><![CDATA[
    .sans { font-family:'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif; }
    .mono { font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
  ]]></style>
</defs>

<rect x="0.5" y="0.5" width="479" height="199" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)"/>
<text x="24" y="34" class="sans" font-size="16" font-weight="700" fill="#f4ecff">Sayan&#8217;s GitHub Stats</text>
<line x1="24" y1="44" x2="456" y2="44" stroke="rgba(255,255,255,0.12)"/>

<g transform="translate(64,100)">
  <circle r="46" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="9"/>
  <circle r="46" fill="none" stroke="url(#ringGrad)" stroke-width="9" stroke-linecap="round"
    transform="rotate(-90)"
    stroke-dasharray="289.03" stroke-dashoffset="289.03" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="289.03" to="26.01" begin="0.3s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </circle>
  <text x="0" y="9" text-anchor="middle" class="sans" font-size="26" font-weight="700" fill="#f4ecff" opacity="0">A+
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
  </text>
</g>

<g transform="translate(150,66)" opacity="0">
  <animateTransform attributeName="transform" type="translate" additive="sum" from="-40 0" to="0 0" begin="0.15s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.5s" fill="freeze"/>
  <text x="0" y="-6" class="mono" font-size="12" fill="#b79ad6">Total Stars</text>
  <text x="200" y="-6" text-anchor="end" class="mono" font-size="12" fill="#f4ecff">128</text>
  <rect x="0" y="0" width="200" height="7" rx="3.5" fill="rgba(255,255,255,0.08)"/>
  <rect x="0" y="0" width="0" height="7" rx="3.5" fill="#ff3fb0">
    <animate attributeName="width" from="0" to="128.0" begin="0.40s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
</g>
<g transform="translate(150,98)" opacity="0">
  <animateTransform attributeName="transform" type="translate" additive="sum" from="-40 0" to="0 0" begin="0.33s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  <animate attributeName="opacity" from="0" to="1" begin="0.33s" dur="0.5s" fill="freeze"/>
  <text x="0" y="-6" class="mono" font-size="12" fill="#b79ad6">Total Commits (2026)</text>
  <text x="200" y="-6" text-anchor="end" class="mono" font-size="12" fill="#f4ecff">940</text>
  <rect x="0" y="0" width="200" height="7" rx="3.5" fill="rgba(255,255,255,0.08)"/>
  <rect x="0" y="0" width="0" height="7" rx="3.5" fill="#9b5cf6">
    <animate attributeName="width" from="0" to="156.7" begin="0.58s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
</g>
<g transform="translate(150,130)" opacity="0">
  <animateTransform attributeName="transform" type="translate" additive="sum" from="-40 0" to="0 0" begin="0.51s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  <animate attributeName="opacity" from="0" to="1" begin="0.51s" dur="0.5s" fill="freeze"/>
  <text x="0" y="-6" class="mono" font-size="12" fill="#b79ad6">Total PRs</text>
  <text x="200" y="-6" text-anchor="end" class="mono" font-size="12" fill="#f4ecff">63</text>
  <rect x="0" y="0" width="200" height="7" rx="3.5" fill="rgba(255,255,255,0.08)"/>
  <rect x="0" y="0" width="0" height="7" rx="3.5" fill="#7ce7e1">
    <animate attributeName="width" from="0" to="126.0" begin="0.76s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
</g>
<g transform="translate(150,162)" opacity="0">
  <animateTransform attributeName="transform" type="translate" additive="sum" from="-40 0" to="0 0" begin="0.69s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  <animate attributeName="opacity" from="0" to="1" begin="0.69s" dur="0.5s" fill="freeze"/>
  <text x="0" y="-6" class="mono" font-size="12" fill="#b79ad6">Contributed to</text>
  <text x="200" y="-6" text-anchor="end" class="mono" font-size="12" fill="#f4ecff">21</text>
  <rect x="0" y="0" width="200" height="7" rx="3.5" fill="rgba(255,255,255,0.08)"/>
  <rect x="0" y="0" width="0" height="7" rx="3.5" fill="#ff8fd4">
    <animate attributeName="width" from="0" to="105.0" begin="0.94s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
</g>
</svg>
